<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline';" />
<title>روال</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    font-family: "Segoe UI", Tahoma, sans-serif;
    background: radial-gradient(120% 120% at 20% 0%, #1e3a8a 0%, #0f172a 55%, #0b1220 100%);
    color: #e6edf7; user-select: none; overflow: hidden;
    -webkit-app-region: drag;
  }
  .logo {
    width: 96px; height: 96px; border-radius: 24px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08) inset;
    animation: pop .7s cubic-bezier(.2,.9,.2,1) both;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: .5px; font-weight: 700; }
  p { margin: 0; font-size: 13px; color: #9fb0c8; }
  .bar {
    width: 190px; height: 4px; border-radius: 99px; overflow: hidden;
    background: rgba(255,255,255,.12); margin-top: 6px;
  }
  .bar span {
    display: block; height: 100%; width: 40%; border-radius: 99px;
    background: linear-gradient(90deg, #22d3ee, #6366f1);
    animation: slide 1.25s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(110%); } 100% { transform: translateX(-320%); } }
  @keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>
  <img class="logo" src="../assets/icon.png" alt="روال" />
  <h1>روال</h1>
  <p>در حال آماده‌سازی میزکار شما…</p>
  <div class="bar"><span></span></div>
</body>
</html>
